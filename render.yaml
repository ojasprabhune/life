services:
  - type: web
    name: lifefolders-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: WGER_API_KEY
        sync: false
